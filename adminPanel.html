<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Manage Plans</title>

  <!-- Same load order as every other page: reset, variables, shared
       components, then this page's own layout rules last. -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/adminLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="admin-header">
    <div class="container admin-header-inner">
      <a href="./index.html" class="back-link">&larr; Back to Site</a>
      <span class="badge">Admin Panel</span>
    </div>
  </header>

  <main class="container admin-main">

    <div class="admin-heading">
      <h1>Manage Plans</h1>
      <p>Add, edit, or remove the pricing plans shown on the website.</p>
    </div>

    <!-- ============ ADD / EDIT FORM ============ -->
    <!--
      This one form is reused for both creating and editing.
      #plan-id is a hidden field: empty means "creating a new plan",
      filled in means "editing that plan's id" - our JS uses this to
      decide whether to send a POST or a PUT.
    -->

       <!-- ============ PLANS LIST ============ -->
    <section class="plans-list-section">
      <h2>Existing Plans</h2>

      <!-- JS fills this in on page load and after every create/update/delete -->
      <div id="plans-list" class="plans-grid"></div>

      <p id="plans-empty" class="empty-state" hidden>No plans yet. Add your first one above.</p>
      <p id="plans-loading" class="empty-state">Loading plans...</p>
    </section>
    <section class="card plan-form-card">
      <h2 id="form-title">Add New Plan</h2>

      <form id="plan-form" novalidate>
        <input type="hidden" id="plan-id" value="" />

        <div class="form-group">
          <label for="plan-name">Name</label>
          <input type="text" name="name" id="plan-name" placeholder="e.g. Pro" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="plan-price">Price</label>
            <input type="number" name="price" id="plan-price" min="0" step="0.01" placeholder="0.00" required />
          </div>

          <div class="form-group">
            <label for="plan-billing-cycle">Billing Cycle</label>
            <select id="plan-billing-cycle" name="billingCycle" required>
              <option value="Monthly">Monthly</option>
              <option value="Yearly">Yearly</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="plan-description">Description</label>
          <textarea id="plan-description" name="description" rows="2" placeholder="A short tagline for this plan"></textarea>
        </div>

        <div class="form-group">
          <label for="plan-features">Features</label>
          <textarea id="plan-features" name="features" rows="4" placeholder="One feature per line"></textarea>
          <p class="field-hint">Write one feature per line - each line becomes a separate bullet point.</p>
        </div>

        <div class="form-group form-checkbox">
          <label>
            <input type="checkbox" name="isActive" id="plan-is-active" checked />
            Active (visible on the pricing page)
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Save Plan</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel</button>
        </div>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>

 

  </main>

  <script type="module" src="./src/pages/planPage.js"></script>
</body>
</html>
