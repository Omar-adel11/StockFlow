<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - StockFlow</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/authLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  .auth-page{width:100%;min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .auth-brand-link{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--color-dark);text-decoration:none}
  .auth-brand-link img{width:auto;height:38px;object-fit:contain}
  .auth-card{width:min(100%,520px);max-width:100%;padding:clamp(20px,4vw,36px)}
  .auth-card form,.auth-card .form-group{width:100%;min-width:0}
  .auth-card input,.auth-card select,.auth-card textarea{width:100%;max-width:100%;min-width:0}
  .auth-card button,.auth-card .btn{max-width:100%;white-space:normal}
  @media(max-width:600px){.auth-page{justify-content:flex-start;padding:16px 12px 24px}.auth-brand-link{align-self:flex-start}.auth-card{padding:20px 16px;border-radius:14px}.auth-header h1{font-size:1.65rem}}
  </style>
</head>
<body>

  <main class="auth-page">
    <a class="auth-brand-link" href="index.html" aria-label="StockFlow home"><img src="images/logo.jpg" alt="StockFlow" /><span>StockFlow</span></a>
    <div class="card auth-card">

      <a href="index.html" class="auth-back-link">&larr; Back to Site</a>

      <div class="auth-header">
        <span class="badge">Create Account</span>
        <h1>Sign Up</h1>
        <p>Create an account to access the admin panel.</p>
      </div>

      <!--
        The backend expects multipart/form-data because of the file
        field. When the JS layer sends this with fetch(), the body will
        be a FormData object rather than JSON.stringify(...) - the
        browser sets the multipart Content-Type header (including its
        boundary) automatically, so JS must NOT set Content-Type itself
        for this one request.
      -->
      <form id="signup-form" novalidate>

        <div class="avatar-upload-row">
          <div class="avatar-preview" id="avatar-preview">👤</div>
          <div>
            <label for="signup-file" class="btn btn-secondary avatar-upload-label">Choose Photo</label>
            <input type="file" id="signup-file" name="file" accept="image/*" class="avatar-upload-input" />
            <p class="field-hint">Optional. PNG or JPG.</p>
          </div>
        </div>

        <div class="form-group">
          <label for="BusinessName">Business Name</label>
          <input type="text" id="BusinessName" name="BusinessName" placeholder="Your Business Name" />
        </div>


        <div class="form-group">
          <label for="signup-name">Name</label>
          <input type="text" id="signup-name" name="name" placeholder="Your full name" />
        </div>

        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="PhoneNumber">Phone Number</label>
          <input type="text" id="PhoneNumber" name="PhoneNumber" placeholder="Your Phone Number " />
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" />
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Re-enter your password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Create Account</button>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </p>

    </div>
  </main>

  <script type="module" src="./src/pages/SignupPage.js"></script>
</body>
</html>
