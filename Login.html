<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - StockFlow</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/authLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  .auth-page{width:100%;min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .auth-brand-link{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--color-dark);text-decoration:none}
  .auth-brand-link img{width:auto;height:38px;object-fit:contain}
  .auth-card{width:min(100%,520px);max-width:100%;padding:clamp(20px,4vw,36px)}
  .auth-card form,.auth-card .form-group{width:100%;min-width:0}
  .auth-card input,.auth-card select,.auth-card textarea{width:100%;max-width:100%;min-width:0}
  .auth-card button,.auth-card .btn{max-width:100%;white-space:normal}
  @media(max-width:600px){.auth-page{justify-content:flex-start;padding:16px 12px 24px}.auth-brand-link{align-self:flex-start}.auth-card{padding:20px 16px;border-radius:14px}.auth-header h1{font-size:1.65rem}}
  </style>
</head>
<body>

  <main class="auth-page">
    <a class="auth-brand-link" href="index.html" aria-label="StockFlow home"><img src="images/logo.jpg" alt="StockFlow" /><span>StockFlow</span></a>
    <div class="card auth-card">

      <a href="index.html" class="auth-back-link">&larr; Back to Site</a>

      <div class="auth-header">
        <span class="badge">Welcome Back</span>
        <h1>Log In</h1>
        <p>Log in to manage your StockFlow account.</p>
      </div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Your password" />
        </div>

        <div class="auth-links-row">
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Log In</button>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>

    </div>
  </main>

  <script type="module" src="./src/pages/LoginPage.js"></script>
</body>
</html>
