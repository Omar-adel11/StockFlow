<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/contactLayout.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="contact-page">
    <div class="card contact-card">

      <div class="contact-intro">
  <div class="contact-topbar">
    <a href="./index.html" class="back-link">&larr; Back to Site</a>
    <span class="badge">Get in Touch</span>
  </div>
  <h1>Contact Us</h1>
  <p>Have a question or an inquiry? Send us a message and we'll get back to you.</p>
</div>

      <!--
        id="contact-form" is how JavaScript will find and "listen" to this
        form later. novalidate turns off the browser's built-in validation
        popups so we can fully control validation ourselves in JS - for
        now, the "required" and type="email" attributes below still give
        basic native validation while we're only testing HTML/CSS.
      -->
      <form id="contact-form" class="contact-form">

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What is this about?" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-submit btn btn-primary btn-block">Send Message</button>

        <!--
          This box is empty on purpose. Later, our JavaScript will put
          text inside it: "Sending...", "Message sent!", or an error.
          aria-live="polite" means screen readers will announce whatever
          text appears here automatically, without needing focus moved.
        -->
        <p id="form-status" class="form-status" aria-live="polite"></p>

      </form>
    </div>
  </main>
  <script type="module" src="./src/pages/Contactpage.js"></script>
</body>
</html>
