<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - StockFlow</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/authLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-page">
    <div class="card auth-card">

      <a href="login.html" class="auth-back-link">&larr; Back to Log In</a>

      <div class="auth-header">
        <span class="badge">Forgot Password</span>
        <h1>Reset Your Password</h1>
        <p>Enter the email on your account and we'll send you a verification code.</p>
      </div>

      <form id="forgot-password-form" novalidate>

        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" placeholder="you@example.com" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Send Verification Code</button>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>

    </div>
  </main>

  <script type="module" src="./src/pages/ForgotPasswordPage.js"></script>
</body>
</html>
