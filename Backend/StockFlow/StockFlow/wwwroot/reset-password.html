<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - StockFlow</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/authLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  .auth-page{width:100%;min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .auth-brand-link{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--color-dark);text-decoration:none}
  .auth-brand-link img{width:auto;height:38px;object-fit:contain}
  .auth-card{width:min(100%,520px);max-width:100%;padding:clamp(20px,4vw,36px)}
  .auth-card form,.auth-card .form-group{width:100%;min-width:0}
  .auth-card input,.auth-card select,.auth-card textarea{width:100%;max-width:100%;min-width:0}
  .auth-card button,.auth-card .btn{max-width:100%;white-space:normal}
  @media(max-width:600px){.auth-page{justify-content:flex-start;padding:16px 12px 24px}.auth-brand-link{align-self:flex-start}.auth-card{padding:20px 16px;border-radius:14px}.auth-header h1{font-size:1.65rem}}
  </style>
</head>
<body>

  <main class="auth-page">
    <a class="auth-brand-link" href="index.html" aria-label="StockFlow home"><img src="images/logo.jpg" alt="StockFlow" /><span>StockFlow</span></a>
    <div class="card auth-card">

      <div class="auth-header">
        <span class="badge">New Password</span>
        <h1>Set a New Password</h1>
        <p>Choose a new password for your account.</p>
      </div>

      <!--
        email and otp are hidden fields, filled in by JS from
        sessionStorage right after a successful check-otp call on the
        previous page - the person never has to re-enter either one here.
      -->
      <form id="reset-password-form" novalidate>
        <input type="hidden" id="reset-email" name="email" />
        <input type="hidden" id="reset-otp" name="otp" />

        <div class="form-group">
          <label for="reset-new-password">New Password</label>
          <input type="password" id="reset-new-password" name="newPassword" placeholder="At least 8 characters" />
        </div>

        <div class="form-group">
          <label for="reset-confirm-password">Confirm New Password</label>
          <input type="password" id="reset-confirm-password" name="confirmNewPassword" placeholder="Re-enter your new password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Reset Password</button>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>

    </div>
  </main>

  <script type="module" src="./src/pages/ResetPasswordPage.js"></script>
</body>
</html>
