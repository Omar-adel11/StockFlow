<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Code - StockFlow</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/authLayout.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  .auth-page{width:100%;min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .auth-brand-link{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--color-dark);text-decoration:none}
  .auth-brand-link img{width:auto;height:38px;object-fit:contain}
  .auth-card{width:min(100%,520px);max-width:100%;padding:clamp(20px,4vw,36px)}
  .auth-card form,.auth-card .form-group{width:100%;min-width:0}
  .auth-card input,.auth-card select,.auth-card textarea{width:100%;max-width:100%;min-width:0}
  .auth-card button,.auth-card .btn{max-width:100%;white-space:normal}
  @media(max-width:600px){.auth-page{justify-content:flex-start;padding:16px 12px 24px}.auth-brand-link{align-self:flex-start}.auth-card{padding:20px 16px;border-radius:14px}.auth-header h1{font-size:1.65rem}}
  </style>
</head>
<body>

  <main class="auth-page">
    <a class="auth-brand-link" href="index.html" aria-label="StockFlow home"><img src="images/logo.jpg" alt="StockFlow" /><span>StockFlow</span></a>
    <div class="card auth-card">

      <a href="forgot-password.html" class="auth-back-link">&larr; Wrong email? Go back</a>

      <div class="auth-header">
        <span class="badge">Verify Code</span>
        <h1>Enter Verification Code</h1>
        <p>We sent a 6-digit code to your email. Enter it below to continue.</p>
      </div>

      <!--
        The email field here is prefilled by JS from what the person
        entered on the forgot-password page (carried over via
        sessionStorage, since these are separate static pages rather
        than a single-page app). It's left as a normal editable input,
        readonly is avoided so someone can still fix a typo without
        starting the whole flow over.
      -->
      <form id="otp-form" novalidate>
      
        <div class="form-group">
          <label for="otp-code">Verification Code</label>
          <input
            type="text"
            id="otp-code"
            name="otp"
            class="otp-input"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="------"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Verify Code</button>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>

      <div class="resend-row">
        Didn't get a code?
        <button type="button" id="resend-btn">Resend code</button>
      </div>

    </div>
  </main>
<script type="module" src="./src/pages/OtpPage.js"></script>
</body>
</html>
