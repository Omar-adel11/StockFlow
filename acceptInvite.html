<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Accept Invitation - StockFlow</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/adminShell.css"><link rel="stylesheet" href="css/entityCrud.css"><link rel="stylesheet" href="css/uiEnhancements.css"></head><body><div class="admin-shell"><div class="admin-content"><main class="admin-main"><section class="card entity-form-card" style="max-width:620px;margin:60px auto"><h1>Join StockFlow</h1><p id="invite-details">Checking invitation...</p><form id="accept-invite-form" hidden><div class="form-group"><label for="invite-name">Name</label><input id="invite-name" required></div><div class="form-group"><label for="invite-phone">Phone Number</label><input id="invite-phone" required></div><div class="form-group"><label for="invite-password">Password</label><input type="password" id="invite-password" minlength="6" required></div><div class="form-group"><label for="invite-file">Profile Image</label><input type="file" id="invite-file" accept="image/*"></div><button class="btn btn-primary" type="submit">Accept Invitation</button></form><p id="invite-status" class="form-status"></p></section></main></div></div><script type="module" src="./src/pages/AcceptInvitePage.js"></script></body></html>
