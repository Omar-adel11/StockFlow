<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Product - StockFlow</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/adminShell.css"><link rel="stylesheet" href="css/entityCrud.css"><link rel="stylesheet" href="css/uiEnhancements.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="sidebar-logo"><img src="images/logo.jpg" alt="StockFlow" />StockFlow</div><ul class="sidebar-nav"><li><a href="dashboard.html"><span class="nav-icon">▦</span> Dashboard</a></li><li><a href="categories.html"><span class="nav-icon">📁</span> Categories</a></li><li><a href="products.html"><span class="nav-icon">📦</span> Products</a></li><li><a href="inventory.html"><span class="nav-icon">🏷️</span> Inventory</a></li><li><a href="warehouses.html"><span class="nav-icon">🏬</span> Warehouses</a></li><li><a href="suppliers.html"><span class="nav-icon">🤝</span> Suppliers</a></li><li><a href="customers.html"><span class="nav-icon">👥</span> Customers</a></li><li><a href="purchase-orders.html"><span class="nav-icon">🧾</span> Purchase Orders</a></li><li><a href="sales-orders.html"><span class="nav-icon">🛒</span> Sales Orders</a></li><li><a href="team.html"><span class="nav-icon">👤</span> Team Members</a></li></ul><div class="sidebar-footer"><a href="profile.html">Profile</a><button type="button" id="logout-btn">Log Out</button></div></aside><div class="admin-content"><header class="admin-topbar"><div><h1 id="page-title">Add Product</h1><p>Create a product and assign its category and preferred supplier.</p></div></header><main class="admin-main"><section class="card entity-form-card"><h2 id="form-title">Add Product</h2><form id="entity-form" novalidate><div class="form-row"><div class="form-group"><label for="product-sku">SKU</label><input id="product-sku" required></div><div class="form-group"><label for="product-name">Name</label><input id="product-name" required></div></div><div class="form-row"><div class="form-group"><label for="product-category">Category</label><select id="product-category"><option value="">Loading...</option></select></div><div class="form-group"><label for="product-supplier">Preferred Supplier</label><select id="product-supplier"><option value="">None</option></select></div></div><div class="form-row"><div class="form-group"><label for="product-unit-price">Unit Price</label><input type="number" id="product-unit-price" min="0" step="0.01" required></div><div class="form-group"><label for="product-reorder-level">Reorder Level</label><input type="number" id="product-reorder-level" min="0" value="0"></div></div><div class="form-checkbox"><label><input type="checkbox" id="product-is-active" checked> Active</label></div><div class="form-actions"><button type="submit" class="btn btn-primary">Save Product</button><a href="products.html" class="btn btn-secondary">Cancel</a></div><p id="form-status" class="form-status"></p></form></section></main></div></div><script type="module" src="./src/pages/AddProductPage.js"></script></body></html>
